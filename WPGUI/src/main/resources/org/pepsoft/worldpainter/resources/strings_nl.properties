ui.html.htmlMirroringWorksBy=<html>Spiegelen werkt door blokken 180 graden te roteren.<br>\nHet werkt niet voor asymmetrische mod-blokken waarvan<br>\nde geroteerde versies geen spiegelbeeld van het origineel zijn.</html>
ui.html.htmlNotesUlLi=<html>\nOpmerkingen\:\n<ul>\n<li>De terreinhoogte en doorlopende lagen zoals bomen, aangepaste objectlagen, Vorst, enz.<br>\nworden vloeiend geschaald met bicubische interpolatie. Artefacten blijven echter onvermijdelijk,<br>\nvooral bij grotere schalen.\n<li>Discrete lagen zoals Aantekeningen en Biomes, maar ook het terreintype, worden geschaald<br>\nmet nearest-neighbour-interpolatie. Bij grotere schalen worden deze duidelijk blokkig.\n<li>Het schalen van terrein met lage resolutie (geïmporteerd uit Minecraft of uit een hoogtekaart<br>\nmet lage resolutie) kan blokkige resultaten geven.\n<li>Aan de randen kan extra land worden toegevoegd om de chunkgrenzen te volgen.\n<li><strong>Let op\:</strong> bij opschalen kan dit mislukken als er te weinig geheugen is. Bewaar uw werk eerst<br>\nop schijf\!\n</ul>\n</html>
ui.html.htmlOnThisPage=<html>Op deze pagina kunt u de exportvolgorde van uw aangepaste lagen instellen en voorkomen dat bepaalde lagen worden geëxporteerd.<br>\nLagen die hoger in de lijst staan, worden <em>eerder</em> geëxporteerd dan lagere lagen. Lagen kunnen niet tussen de eerste en tweede doorgang worden verplaatst.<br>\n<strong>Let op\:</strong> zodra u de volgorde op dit scherm aanpast, worden nieuwe lagen aan het einde van de lijst toegevoegd.</html>
ui.html.htmlOptimiseOnLoad=<html>Optimaliseren bij laden,<br>schalen bij tekenen</html>
ui.html.htmlOptimisesTheImage=<html>Optimaliseert de afbeelding bij het eerste laden,<br>maar schaalt hem tijdens het tekenen. Gebruikt minder geheugen.</html>
ui.html.htmlPerformATest=<html>Een testexport uitvoeren met beperkt gebied en/of beperkte functies<br>voor een snellere export\:</html>
ui.html.htmlReplacesAllAir=<html>Vervangt alle lucht, water, lava en andere niet-vaste blokken door steen.<br>\nGebruik ook "alle menselijke constructies verwijderen" om ook menselijke blokken te vervangen.</html>
ui.html.htmlScaleTheLevels=<html>De niveaus met het opgegeven percentage schalen;<br>\nniveaus die (nog) te laag of te hoog zijn, worden afgekapt.</html>
ui.html.htmlScalesAndOptimises=<html>Schaalt en optimaliseert de afbeelding in het geheugen<br>bij het eerste laden. Gebruikt veel geheugen.</html>
