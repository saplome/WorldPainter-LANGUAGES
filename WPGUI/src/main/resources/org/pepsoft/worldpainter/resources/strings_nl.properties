ui.about.languages.body=<h2>WorldPainter Languages</h2><p>Versie {0} — een onofficiële meertalige fork van WorldPainter {1} met de interface in 11 talen\: Engels, Russisch, Belarussisch, Oekraïens, Kazachs, Duits, Frans, Spaans, Italiaans, Nederlands en Chinees.</p><p>Fork, interfacevertalingen en de extra functies © 2026 <a href="https\://github.com/saplome">saplome</a>. De originele WorldPainter is © 2011–2026 pepsoft.org, Nederland, door Pepijn Schmitz.</p><p>Als u het project nuttig vindt, geef de repository dan een star op GitHub\:<br><a href="https\://github.com/saplome/WorldPainter-LANGUAGES">github.com/saplome/WorldPainter-LANGUAGES</a></p><p>WorldPainter Languages is niet verbonden aan de auteur van het originele project. U kunt het originele WorldPainter steunen op <a href="https\://www.worldpainter.net/">worldpainter.net</a>.</p>
