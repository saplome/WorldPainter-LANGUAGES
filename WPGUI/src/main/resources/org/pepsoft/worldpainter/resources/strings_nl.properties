may.we.have.your.permission=Hebben we je toestemming om anonieme gebruiksgegevens te verzamelen?\nDit is puur bedoeld om de nieuwsgierigheid van de auteur te bevredigen\nover hoeveel mensen het programma gebruiken, waar die (ongeveer) vandaan\nkomen, en welke functionaliteit het meest gebruikt wordt. De statistieken\nbevatten geen persoonlijke gegevens, en zullen nooit aan derde partijen\ngegeven of verkocht worden.\n\nAls je dit toestaat krijg je misschien een vraag van je firewall om\ntoestemming om informatie naar het Internet te sturen. Zo ja, bevestig\ndan a.u.b. die toestemming.
