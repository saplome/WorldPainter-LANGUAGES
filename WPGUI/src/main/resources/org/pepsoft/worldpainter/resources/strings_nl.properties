ui.dialog.masterDimensionInfo.title=Wat is een Master-dimensie
ui.dialog.masterDimensionInfo.message=<html><h1>Master-dimensies</h1><p>Een Master-dimensie is een dimensietype van WorldPainter (vergelijkbaar met een plafonddimensie). Hij wordt<br>op schaal 1\:16 geëxporteerd overal waar de gewone oppervlakdimensie niet bestaat. Omdat de Master-dimensie<br>pas bij het exporteren wordt geschaald, zijn handelingen als opslaan, laden en bewerken <em>veel</em> sneller dan<br>bij een gewone oppervlakdimensie van dat formaat. Let op\: het exporteren duurt wel even lang.</p><p>Gebruik een Master-dimensie om snel grote, kenmerkloze gebieden van uw wereld te maken (oceanen, continenten,<br>woestijnen, enz.). Als u tegels aan de oppervlakdimensie toevoegt, worden ze geïnitialiseerd met de inhoud<br>van de Master-dimensie op die locatie. Zo kunt u de grove vormen van uw wereld snel in de Master-dimensie<br>schetsen en daarna waar nodig de details invullen in de oppervlakdimensie.</p><p>Master-dimensies kunnen alle mogelijkheden van gewone oppervlakdimensies gebruiken (terreintypen, lagen, enz.),<br>zodat ook grote bossen, grottenstelsels, enz. er eenvoudig mee te maken zijn.</p></html>
