ui.html.htmlTheRandomVariations=<html>De willekeurige variaties van de geselecteerde objecten zijn niet allemaal gelijk.<br>Vink het vakje aan als u ze allemaal op dezelfde waarde wilt zetten.</html>
ui.html.htmlTheRelativeFrequencies=<html>De relatieve frequenties van de geselecteerde objecten zijn niet allemaal gelijk.<br>Vink het vakje aan als u ze allemaal op dezelfde waarde wilt zetten.</html>
ui.html.htmlTheseAreThe=<html>Dit zijn de standaardinstellingen. Ze kunnen alleen worden ingesteld bij het maken<br>van de laag. Bewerk daarna de vloerdimensie om hoogte en vorm te wijzigen.</html>
ui.html.htmlThisIsAn=<html>Dit is een alfaversie van de zwevende-dimensiefunctie. Deze is niet afgerond en<br>werkt mogelijk niet correct. De functionaliteit kan veranderen. Plaats feedback op de subreddit.</html>
ui.html.htmlThisMapFormat=<html>Dit kaartformaat is onbekend en kan niet worden geëxporteerd. Waarschijnlijk<br>\nwordt het ondersteund door een plugin die niet is geïnstalleerd of niet kan worden geladen.</html>
ui.html.htmlThisRemovesEm=<html>Dit verwijdert <em>alle</em> houten blokken en bladeren, ook menselijke\!<br>\nWorldPainter kan geen onderscheid maken tussen natuurlijke en menselijke houtblokken.<br>\nBescherm uw bouwwerken met de Alleen-lezen-laag.</html>
ui.html.htmlThisWillCreate=<html>Dit maakt een ronde wereld. De afmeting geeft de diameter van de cirkel aan en<br>\nde oorsprong (0,0) wordt het middelpunt. De laag Leegte wordt gebruikt om de ronde rand van de wereld te maken.</html>
ui.html.htmlThisWillMark=<html>Dit markeert het hele terrein als onbevolkt, waardoor Minecraft bomen,<br/>\nwater- en lavapoelen, plekken met aarde, grind, steenkool, erts, enz. (maar geen spelonken) genereert<br/>\nzodra de chunks worden geladen. Dit vertraagt het eerste laden van elke chunk en u hebt<br/>\ngeen controle over waar bomen, sneeuw, enz. verschijnen.</html>
ui.html.htmlToChangeThe=<html>Sluit dit venster om de vloerhoogte en -vorm te wijzigen,<br>rechts-klik op de laagknop en kies "Zwevende dimensie bewerken".</html>
