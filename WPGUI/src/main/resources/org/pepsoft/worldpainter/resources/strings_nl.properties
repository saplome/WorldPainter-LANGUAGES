ui.dialog.createMasterDimension.intro=<p>Een Master-dimensie wordt geëxporteerd met 256 keer de oppervlakte en versnelt het maken van zeer grote kaarten.</p>
ui.dialog.createMasterDimension.bulletIrreversible=<li>U <b>kunt later niet meer van gedachten veranderen</b>; om deze keuze ongedaan te maken moet u opnieuw beginnen.
