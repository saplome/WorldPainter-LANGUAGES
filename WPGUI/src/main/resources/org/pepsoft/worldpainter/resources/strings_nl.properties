startup.snapshot.message=<html><h1>Waarschuwing\: snapshotversie</h1><p>Dit is een snapshotversie van WorldPainter. Deze is <em>uitsluitend</em> bedoeld om te testen\!<p>Werelden die u met deze versie bewerkt <strong>zijn mogelijk niet te openen</strong> in de volgende productieversie<br>wanneer die uitkomt, en <strong>zijn niet te openen</strong> in de huidige productieversie\!<p><strong>Maak backups</strong> van bestaande werelden waarmee u deze versie wilt testen, op een veilige plek.<p>Al het werk dat u met deze testversie doet kan verloren gaan, en als u geen backups maakt<br>kunt u uw huidige werelden kwijtraken.<p>Meld fouten a.u.b. op GitHub\: https\://github.com/Captain-Chaos/WorldPainter<p>Typ hieronder "I understand" om verder te gaan met het testen van de volgende versie van WorldPainter\:</p></html>
